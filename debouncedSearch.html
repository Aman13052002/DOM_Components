<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Debounced Search</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial,sans-serif;
        }

        body{
            padding:30px;
            background:#f4f4f4;
        }

        h1{
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            font-size:18px;
            margin-bottom:20px;
        }

        #status{
            margin-bottom:15px;
            color:#555;
        }

        .card{
            background:white;
            padding:15px;
            margin-bottom:12px;
            border-radius:8px;
            box-shadow:0 2px 8px rgba(0,0,0,.1);
        }

        .card h3{
            margin-bottom:8px;
        }

        .card p{
            color:#666;
        }
    </style>
</head>
<body>
    <h1>Debounced Search</h1>
    <input type="text" id="search" placeholder="Search...">
    <p id="status"></p>
    <div id="results"></div>
    <script>
        const search = document.getElementById('search');
        const result = document.getElementById('results');
        const status = document.getElementById('status');

        let timer;
        search.addEventListener('input',()=>{
            clearTimeout(timer);
            timer = setTimeout(()=>{
                searchUsers(search.value);
            },400);
        })

        async function searchUsers(text){
            result.innerHTML = "";
            if(text.trim() == ""){
                status.textContent = "";
                return;
            }

            status.textContent = "Search...";
            try{
                const response = await fetch("https://jsonplaceholder.typicode.com/users");
                if(!response.ok){
                    throw new Error("Request Failed!");
                }
                const data = await response.json();
                console.log(data);
                const filteredData = data.filter(user=> user.name.toLowerCase().includes(text.toLowerCase()));
                status.textContent = "";
                if(filteredData.length===0){
                    result.innerHTML = `<p>No Users found</p>`;
                    return;
                } 

                filteredData.forEach((user=>{
                    const card = document.createElement('div');
                    card.classList.add('card');
                    card.innerHTML = `<h3>${user.name}</h3>
                                    <p>${user.email}</p>
                                    <p>${user.company.name}</p>
                    `;
                    result.appendChild(card);
                }))
            }catch(err){
                console.log(err.message);
            }
        }
    </script>
</body>
</html>
