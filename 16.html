<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <style>
        body {
            font-family: Arial, sans-serif;
        }

        .board {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 20px;
        }

        .column {
            width: 250px;
            min-height: 300px;
            background: #f4f4f4;
            padding: 10px;
            border-radius: 8px;
        }

        .column h2 {
            text-align: center;
        }

        .task {
            background: white;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            cursor: grab;
        }

        .column.drag-over {
            background-color: #dbeafe;
        }
    </style>
</head>
<body>
    <h1 style="text-align:center;">Drag & Drop Kanban Board</h1>

<div class="board">

    <div class="column" id="todo">
        <h2>Todo</h2>

        <div class="task" draggable="true" id="task1">
            Design Homepage
        </div>

        <div class="task" draggable="true" id="task2">
            Create API
        </div>
    </div>

    <div class="column" id="inprogress">
        <h2>In Progress</h2>

        <div class="task" draggable="true" id="task3">
            Write Documentation
        </div>
    </div>

    <div class="column" id="done">
        <h2>Done</h2>

        <div class="task" draggable="true" id="task4">
            Setup Project
        </div>
    </div>

</div>
<script>
    const tasks = document.querySelectorAll(".task");
    const columns = document.querySelectorAll(".column");

    // Start dragging
    tasks.forEach(task => {
        task.addEventListener("dragstart", (e) => {
            e.dataTransfer.setData("text/plain", e.target.id);
        });
    });

    // Allow dropping
    columns.forEach(column => {

        column.addEventListener("dragover", (e) => {
            e.preventDefault();
            column.classList.add("drag-over");
        });

        column.addEventListener("dragleave", () => {
            column.classList.remove("drag-over");
        });

        column.addEventListener("drop", (e) => {
            e.preventDefault();

            const taskId = e.dataTransfer.getData("text/plain");
            const task = document.getElementById(taskId);

            column.appendChild(task);
            column.classList.remove("drag-over");
        });
    });
</script>
</body>
</html>
