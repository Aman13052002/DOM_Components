<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban Board</title>
    <style>
        *{
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            font-family: 'Times New Roman', Times, serif;
        }
        body{
            background-color: azure;
            padding: 20px;
        }
        h1{
            text-align: center;
            margin-bottom: 30px;
        }
        .board{
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 20px;
        }
        .column{
            background-color: #ddd;
            padding: 15px;
            border-radius: 8px;
        }

        .column h2{
            text-align: center;
            margin-bottom: 15px;
        }

        .task-list{
            min-height: 300px;
        }

        .task{
            background-color: white;
            padding: 12px;
            margin-bottom: 10px;
            border-radius: 6px;
            cursor: grab;
            box-shadow: 0 2px 5px rgba(0,0,0,0.15);
        }

        .task.dragging{
            opacity: 0.5;
        }
    </style>
</head>
<body>
    <h1>Kanban Board</h1>
    <div class="board">
        <div class="column">
            <h2>To Do</h2>
            <div class="task-list">
                <div class="task" draggable="true">Learn Coding</div>
                <div class="task" draggable="true">Do HTML</div>
            </div>
        </div>

        <div class="column">
            <h2>In Progress</h2>
            <div class="task-list">
                <div class="task" draggable="true">Build Login Page</div>
            </div>
        </div>


        <div class="column">
            <h2>Done</h2>
            <div class="task-list">
                <div class="task" draggable="true">Let's Develop</div>
            </div>
        </div>
    </div>

    <script>
        const taskList = document.querySelectorAll('.task-list');
        let draggedTask = null;
        document.addEventListener("dragstart",(event)=>{
            if(event.target.classList.contains('task')){
                draggedTask = event.target;
                draggedTask.classList.add('dragging');
            }
        });

        document.addEventListener('dragend',(event)=>{
            if(draggedTask){
                draggedTask.classList.remove('dragging');
                draggedTask = null;
            }
        });


        taskList.forEach(list=>{
            list.addEventListener('dragover',(event)=>{
                event.preventDefault();
            });

            list.addEventListener('drop',()=>{
                if(draggedTask){
                    list.appendChild(draggedTask);
                }
            });
        });
    </script>
</body>
</html>
