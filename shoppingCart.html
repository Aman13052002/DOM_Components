<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart</title>
    <style>
        body{
            font-family: Arial, sans-serif;
            background:#f4f4f4;
            padding:40px;
        }

        .cart{
            background:white;
            padding:20px;
            width:250px;
            margin-bottom:30px;
            border-radius:8px;
            box-shadow:0 0 5px rgba(0,0,0,.2);
        }

        .products{
            display:flex;
            gap:20px;
        }

        .product{
            background:white;
            width:180px;
            padding:20px;
            border-radius:8px;
            box-shadow:0 0 5px rgba(0,0,0,.2);
            text-align:center;
        }

        button{
            padding:8px 15px;
            cursor:pointer;
        }
    </style>
</head>
<body>
    <h1>Shopping Cart</h1>
    <div class="cart">
        <h2>Cart Summary</h2>
        <p>Items: <span id="itemCount">0</span></p>
        <p>Total Price: ₹<span id="totalPrice">0</span></p>
    </div>

    <div class="products">
        <div class="product">
            <h3>Laptop</h3>
            <p>₹50000</p>
            <button data-price="50000">Add to Cart</button>
        </div>
        <div class="product">
            <h3>Headphones</h3>
            <p>₹2000</p>
            <button data-price="2000">Add to Cart</button>
        </div>
        <div class="product">
            <h3>Mouse</h3>
            <p>₹800</p>
            <button data-price="800">Add to Cart</button>
        </div>
    </div>
    <script>
        const buttons = document.querySelectorAll('button');
        const itemCount = document.getElementById('itemCount');
        const totalPrice = document.getElementById('totalPrice');

        let cartItems = [];

        buttons.forEach((button)=>{
            button.addEventListener('click',()=>{
                const price = Number(button.dataset.price);
                cartItems.push(price);
                itemCount.textContent = cartItems.length;
                const total = cartItems.reduce((sum,price)=>{
                    return sum+price;
                },0);
                totalPrice.textContent = total;
            })
        })

    </script>
</body>
</html>
